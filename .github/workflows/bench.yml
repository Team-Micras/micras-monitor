name: Bench

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-24.04
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      BASE_DIR: ${{ github.workspace }}/../base
      RESULTS: ${{ github.workspace }}/../bench-results
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - run: bunx playwright install --with-deps chromium

      - name: Check out the base commit
        id: base
        run: |
          mkdir -p "$RESULTS"
          if [[ "$BASE_SHA" =~ ^0*$ ]] || ! git cat-file -e "$BASE_SHA^{commit}"; then
            echo "::notice::No base commit to compare with."
            exit 0
          fi
          git worktree add --detach "$BASE_DIR" "$BASE_SHA"
          if grep -q -- "'no-budgets'" "$BASE_DIR/scripts/bench.ts" 2>/dev/null; then
            echo "benchable=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The base commit has no bench to compare with."
          fi

      - name: Install the base commit
        if: steps.base.outputs.benchable == 'true'
        working-directory: ${{ env.BASE_DIR }}
        run: |
          bun install --frozen-lockfile
          bunx playwright install chromium

      - name: Bench the base and the head, twice, one after the other
        id: runs
        if: steps.base.outputs.benchable == 'true'
        run: |
          base_ok=true
          for round in 1 2; do
            base_file="$RESULTS/base-$round.json"
            if ! (cd "$BASE_DIR" && bun run bench -- --no-budgets --output "$base_file") \
              || ! test -s "$base_file"; then
              echo "::notice::Round $round of the base commit's bench failed."
              base_ok=false
            fi
            bun run bench -- --no-budgets --output "$RESULTS/head-$round.json"
          done
          echo "base_ok=$base_ok" >> "$GITHUB_OUTPUT"

      - name: Compare the head with the base
        if: steps.runs.outputs.base_ok == 'true'
        run: >-
          bun scripts/bench-diff.ts
          --base "$RESULTS/base-1.json" --base "$RESULTS/base-2.json"
          --head "$RESULTS/head-1.json" --head "$RESULTS/head-2.json"

      - name: Run the head's performance tests, with no base to compare with
        if: steps.runs.outputs.base_ok != 'true'
        run: |
          echo "::notice::No complete base results; the head's performance tests only have to pass."
          bun run bench -- --no-budgets --output "$RESULTS/head-alone.json"
